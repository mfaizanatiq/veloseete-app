name: Veloseete
options:
  bundleIdPrefix: com.veloseete
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.40.0"
settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  Veloseete:
    type: application
    platform: iOS
    sources:
      - path: Veloseete
        excludes:
          - Info.plist
          - Resources/**
          - Veloseete.entitlements
          - PrivacyInfo.xcprivacy
          - GoogleService-Info.plist
      - path: Shared
      - path: Veloseete/Resources/Assets.xcassets
        buildPhase: resources
      - path: Veloseete/Resources/Fonts
        buildPhase: resources
        type: folder
      - path: Veloseete/Resources/FluentEmoji
        buildPhase: resources
        type: folder
      - path: Veloseete/Resources/Media
        buildPhase: resources
        type: folder
      - path: Veloseete/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Veloseete/GoogleService-Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veloseete.ios
        PRODUCT_NAME: Veloseete
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "28"
        INFOPLIST_FILE: Veloseete/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
        DEVELOPMENT_TEAM: X978QRK3WP
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Veloseete/VeloseeteDebug.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Veloseete/Veloseete.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: VeloseeteTripWidget
        embed: true
    postCompileScripts:
      - name: Ensure Fonts Copied
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          SRC="${SRCROOT}/Veloseete/Resources/Fonts"
          mkdir -p "$DEST"
          if [ -d "$SRC" ]; then
            cp -f "$SRC"/*.ttf "$DEST/" 2>/dev/null || true
            echo "Copied fonts to $DEST"
            ls -la "$DEST"/*.ttf 2>/dev/null || echo "No ttf in dest"
          fi

  VeloseeteTripWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: VeloseeteTripWidget
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
          - "*.entitlements"
      - path: VeloseeteTripWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veloseete.ios.TripWidget
        PRODUCT_NAME: VeloseeteTripWidget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "28"
        INFOPLIST_FILE: VeloseeteTripWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        DEVELOPMENT_TEAM: X978QRK3WP
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: VeloseeteTripWidget/VeloseeteTripWidgetDebug.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SWIFT_VERSION: "5.9"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: VeloseeteTripWidget/VeloseeteTripWidget.entitlements

  VeloseeteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VeloseeteTests
    dependencies:
      - target: Veloseete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veloseete.ios.tests
        PRODUCT_NAME: VeloseeteTests
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: X978QRK3WP
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Veloseete.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Veloseete"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Veloseete:
    build:
      targets:
        Veloseete: all
        VeloseeteTripWidget: [build]
        VeloseeteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VeloseeteTests
    profile:
      config: Release
    archive:
      config: Release

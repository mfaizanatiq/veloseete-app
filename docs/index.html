<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Veloseete Legal</title>
<meta name="description" content="Privacy Policy and Terms of Use for Veloseete." />
<style>
:root { color-scheme: dark; --bg:#0E0F10; --text:#F4F5F0; --muted:#9A9E94; --accent:#D9FC55; --card:#1A1C1E; }
* { box-sizing: border-box; }
body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); line-height:1.55; }
main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
nav { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:2rem; font-size:0.9rem; align-items:center; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.85rem; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
h2 { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
p { color: var(--muted); margin: 0.75rem 0; }
ul { padding-left: 1.2rem; color: var(--muted); }
li { margin: 0.4rem 0; }
.brand { font-weight: 700; color: var(--text); font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase; }
.card { background: var(--card); border-radius: 16px; padding: 1.25rem 1.35rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
<nav>
  <span class="brand">Veloseete</span>
  <a href="./privacy/">Privacy</a>
  <a href="./terms/">Terms</a>
</nav>
<h1>Legal</h1>
<p>Public documents for the Veloseete iOS app. Use these URLs in App Store Connect.</p>
<div class="card">
  <p><a href="./privacy/">Privacy Policy</a></p>
  <p><a href="./terms/">Terms of Use</a></p>
  <p>Support: <a href="mailto:m.faizan.atiq@icloud.com?subject=Veloseete%20Support">m.faizan.atiq@icloud.com</a></p>
</div>
</main>
</body>
</html>
